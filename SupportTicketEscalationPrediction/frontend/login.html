<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Support Ticket Escalation Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b1c30 0%, #131b2e 100%);
            height: 100vh; display: flex;  align-items: center;
            justify-content: center; margin: 0;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .blob1 {
            position: absolute;
            top: -10%; left: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(134, 242, 228, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;    z-index: 0;
            animation: float 8s ease-in-out infinite;
        }

        .blob2 {
            position: absolute;
            bottom: -20%;   right: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(94, 153, 255, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;  z-index: 0;
            animation: float 12s ease-in-out infinite reverse;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -50px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>

<body class="text-white relative">
    <div class="blob1"></div>
    <div class="blob2"></div>

    <div class="glass-panel w-full max-w-md p-10 rounded-2xl shadow-2xl relative z-10 flex flex-col">
        <div class="mb-10 text-center">
            <h1
                class="text-3xl font-black tracking-tight mb-2 text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-blue-400">
                Escalation Intelligence</h1>
            <p class="text-sm font-medium text-slate-400 tracking-widest uppercase">AI-Powered Ticket Escalation
                Prediction</p>
        </div>

        <form id="login-form" class="flex flex-col gap-5">
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Analyst ID</label>
                <input type="text" id="username" autocomplete="off"
                    class="w-full bg-slate-900/50 border border-slate-700/50 text-white text-sm rounded-lg focus:ring-emerald-400 focus:border-emerald-400 block px-4 py-3 placeholder-slate-500 transition-colors"
                    placeholder="e.g. admin" required>
            </div>

            <!-- password -->
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password"
                    class="w-full bg-slate-900/50 border border-slate-700/50 text-white text-sm rounded-lg focus:ring-emerald-400 focus:border-emerald-400 block px-4 py-3 placeholder-slate-500 transition-colors"
                    placeholder="••••••••" required>
            </div>


            <div id="error-msg"
                class="hidden text-red-400 text-xs font-semibold text-center mt-2 bg-red-400/10 py-2 rounded">
                Invalid credentials provided.
            </div>

            <button type="submit"
                class="mt-4 w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3.5 px-4 rounded-lg shadow-lg hover:shadow-emerald-500/25 transition-all duration-200 transform hover:-translate-y-0.5">
                Login
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-white/5 text-center">
            <p class="text-[10px] text-slate-500 uppercase tracking-widest">Authorized Personnel Only</p>
        </div>
    </div>

    <script>
        //attach a friendly submit handler to the login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            //read inputs
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');

            //simple UX
            errorEl.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });

                //check status
                if (response.ok) {
                    const data = await response.json();
                    // Persist token and navigate to the main app
                    localStorage.setItem('auth_token', data.token);
                    window.location.href = '/app/predictive_analytics_overview.html';
                } else {
                    // Show a light error message for the user
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                // Network or unexpected error — log for debugging and inform the user
                console.error('Login error:', err);
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
